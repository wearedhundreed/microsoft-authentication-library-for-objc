name: Apple SDK CI

on:
  push:
    branches:
      - dev
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-manifest:
    name: Swift package manifest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Swift package manifest
        run: swift package dump-package > /dev/null

      - name: Validate CocoaPods specification syntax
        run: ruby -c MSAL.podspec

  apple-project:
    name: Xcode project metadata
    runs-on: macos-15
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Xcode project file
        run: plutil -lint MSAL/MSAL.xcodeproj/project.pbxproj

      - name: Enumerate Xcode schemes
        run: xcodebuild -list -project MSAL/MSAL.xcodeproj
