name: Build MSAL iPhone Test Sample

on:
  push:
    branches: [test/msal-iphone-device-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the Objective-C sample for physical iPhones
        run: |
          xcodebuild build \
            -workspace Samples/ios/SampleApp.xcworkspace \
            -scheme SampleAppiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/msal-build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify and package the unsigned sample
        run: |
          settings=$(xcodebuild -showBuildSettings -json \
            -workspace Samples/ios/SampleApp.xcworkspace \
            -scheme SampleAppiOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/msal-build" CODE_SIGNING_ALLOWED=NO)
          app=$(jq -er '.[] | select(.target == "SampleAppiOS") | .buildSettings | .TARGET_BUILD_DIR + "/" + .WRAPPER_NAME' <<< "$settings")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app/Info.plist"
          xcrun lipo "$app/$executable" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/msal-package/Payload"
          ditto "$app" "$RUNNER_TEMP/msal-package/Payload/SampleAppiOS.app"
          cd "$RUNNER_TEMP/msal-package"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/MSAL-iOS-sample-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: MSAL-iOS-sample-unsigned
          path: ${{ runner.temp }}/MSAL-iOS-sample-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
